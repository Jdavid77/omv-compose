services:
  database:
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
    container_name: immich_postgres
    volumes:
      - ${APPDATA:?APPDATA is not set in global.env}/immich_postgres/data:/var/lib/postgresql/data/pgdata
    environment:
      PGDATA: "/var/lib/postgresql/data/pgdata"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    env_file:
      - ./.env
    ports:
      - '6001:5432'
    restart: always
    healthcheck:
      disable: false
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        # buffer in dockerd instead of failing the container when the collector is down
        fluentd-async: "true"
        # nanosecond timestamps keep the order of lines logged within the same second
        fluentd-sub-second-precision: "true"
    shm_size: 128mb
