services:
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
    env_file:
      - ./.env
    environment:
      PGDATA: "/var/lib/postgresql/data/pgdata"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - "/srv/dev-disk-by-uuid-ff763355-7fef-41fe-b2d7-6d368a3b4313/docker/appdata/immich_postgres/data:/var/lib/postgresql/data/pgdata"
    ports:
      - "6001:5432"
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
