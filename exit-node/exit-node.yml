services:
  nordvpn:
    image: tailnord:local
    build: .
    container_name: tailnord-nordvpn
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ${APPDATA:?APPDATA is not set in global.env}/scripts/nordvpn:/scripts
    environment:
      - "NORDVPN_ENDPOINT=Madrid"
      - "NORDVPN_TECHNOLOGY=openvpn"
      - "NORDVPN_OPENVPN_PROTOCOL=tcp"
    env_file:
      - ./.env
    networks:
      tailnord-net:
        ipv4_address: 10.1.1.3
    entrypoint:
      - /scripts/nordvpn.sh
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - "nordvpn status | grep -q 'Status: Connected'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # check every 5s while starting, so the container turns healthy soon after it connects
      start_interval: 5s
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        # buffer in dockerd instead of failing the container when the collector is down
        fluentd-async: "true"
        # nanosecond timestamps keep the order of lines logged within the same second
        fluentd-sub-second-precision: "true"
    cap_add:
      - net_admin
      - sys_module
    hostname: tailnord-nordvpn
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=1
  tailscale:
    image: "tailscale/tailscale:v1.104.7"
    container_name: tailnord-tailscale
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ${APPDATA:?APPDATA is not set in global.env}/tailscale:/var/lib/tailscale
      - ${APPDATA:?APPDATA is not set in global.env}/scripts/tailscale:/scripts
    env_file:
      - ./.env
    networks:
      tailnord-net:
        ipv4_address: 10.1.1.2
    command:
      - /scripts/tailscale.sh
    restart: always
    healthcheck:
      test:
        - CMD
        - tailscale
        - status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # check every 5s while starting, so the container turns healthy soon after it connects
      start_interval: 5s
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        # buffer in dockerd instead of failing the container when the collector is down
        fluentd-async: "true"
        # nanosecond timestamps keep the order of lines logged within the same second
        fluentd-sub-second-precision: "true"
    user: root
    cap_add:
      - net_admin
      - sys_module
    hostname: tailnord-tailscale
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
networks:
  tailnord-net:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.1.1.0/24
