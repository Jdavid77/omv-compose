services:
  pihole:
    hostname: pihole
    networks:
      pih_network:
        ipv4_address: 192.168.1.139
    container_name: pihole
    image: pihole/pihole:2026.11.0
    # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      #- "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
      - "80:80/tcp"
    cap_add:
      - NET_BIND_SERVICE
      - SYS_TIME #NTP
    env_file:
      - ./.env
    environment:
      TZ: "Europe/Lisbon"
    volumes:
      - "/srv/dev-disk-by-uuid-ff763355-7fef-41fe-b2d7-6d368a3b4313/docker/appdata/pihole/etc-pihole:/etc/pihole"
      - "/srv/dev-disk-by-uuid-ff763355-7fef-41fe-b2d7-6d368a3b4313/docker/appdata/pihole/etc-dnsmasq.d:/etc/dnsmasq.d"
    restart: unless-stopped
networks:
  pih_network:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
          ip_range: 192.168.1.139/32
