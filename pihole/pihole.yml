services:
  pihole:
    image: pihole/pihole:2026.11.0
    container_name: pihole
    volumes:
      - ${APPDATA:?APPDATA is not set in global.env}/pihole/etc-pihole:/etc/pihole
      - ${APPDATA:?APPDATA is not set in global.env}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    environment:
      TZ: "Europe/Lisbon"
    env_file:
      - ./.env
    # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      #- "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
      - '80:80/tcp'
    networks:
      pih_network:
        ipv4_address: 192.168.1.139
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        # buffer in dockerd instead of failing the container when the collector is down
        fluentd-async: "true"
        # nanosecond timestamps keep the order of lines logged within the same second
        fluentd-sub-second-precision: "true"
    cap_add:
      - NET_BIND_SERVICE
      - SYS_TIME #NTP
    hostname: pihole
networks:
  pih_network:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
          ip_range: 192.168.1.139/32
