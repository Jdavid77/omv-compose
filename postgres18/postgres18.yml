services:
  db:
    image: ghcr.io/baosystems/postgis:18-3.6
    container_name: postgres18
    volumes:
      - ${APPDATA:?APPDATA is not set in global.env}/postgres18/data:/var/lib/postgresql/data/pgdata
    environment:
      PGDATA: "/var/lib/postgresql/data/pgdata"
    env_file:
      - ./.env
    ports:
      - '5434:5432'
    restart: always
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        # buffer in dockerd instead of failing the container when the collector is down
        fluentd-async: "true"
        # nanosecond timestamps keep the order of lines logged within the same second
        fluentd-sub-second-precision: "true"
